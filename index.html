<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Icons -->
    <link rel="stylesheet" href="css/icons-1.10.2/font/bootstrap-icons.css">
    <title>Carrito</title>
</head>
<body>
  <!-- Cabecera -->
    <header>
      <div class="container">
        <div class="row">
          <div class="col-6">
            <div class="d-flex justify-content-start">
              <img src="img/logo.png" alt="" srcset="" class="logo-img">
            </div>
          </div>
          <div class="col-6 d-flex justify-content-end">
            <img src="img/carrito.png" alt="" srcset="" class="carrito-img" data-bs-toggle="modal" data-bs-target="#carritoModal">
            
            <div id="cont-items">
              <span id="items-carrito"></span>
            </div>
          </div>
        </div>
      </div>
    </header>
  
    <!-- Productos -->
        <div id="container" class="container">
            
        </div>

    <!-- nevegación -->
    <nav id="nav-pag" aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item"><a class="nav-prod" href="javascript:prevPage()">< Anterior</a></li>
        <li class="page-item"><a class="nav-prod" href="javascript:nextPage()">Siguiente ></a></li>
      </ul>
    </nav>

    <!-- modal -->
    <div id="carritoModal" class="modal fade" tabindex="-1">
        <div id="modal" class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title"><i class="bi bi-cart"></i> Mi carrito</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!-- <p>Modal body text goes here.</p> -->
            </div>
            <div class="modal-footer">
              <div class="div-precio">
                <span>Precio total:</span>
                <p id="precioTotal" class="text-center"></p>
              </div>
              <div class="btns-carrito container-fluid">
                <button type="button" id="vaciarCarrito" class="btn btn-danger"><i class="bi bi-trash-fill"></i> Vaciar carrito</button>
                <button type="button" class="btn btn-primary ms-2 me-2" data-bs-dismiss="modal"><i class="bi bi-bag-fill"></i> Seguir comprando</button>
                  <button id="btn-ir-pagar" type="button" class="btn btn-success" onclick="irAPagar()"><i class="bi bi-cash-coin"></i> Pagar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    <script src="js/js.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
