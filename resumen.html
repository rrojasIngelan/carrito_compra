<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Carrito</title>
</head>
<body>
  <!-- Cabecera -->
  <header>
    <div class="container">
      <div class="row">
        <div class="col-6">
          <div class="d-flex justify-content-start">
            <img src="img/logo.png" alt="" srcset="" class="logo-img">
          </div>
        </div>
        <div class="col-6 d-flex justify-content-end">
          <img id="img-salir" src="img/salir.png" alt="" srcset="" class="carrito-img" data-bs-toggle="modal" data-bs-target="#carritoModal">
          
          <div id="cont-items">
            <span id="items-carrito"></span>
          </div>
        </div>
      </div>
    </div>
  </header>
    <a href="javascript:volver()">
      <img id="img-atras" src="img/atras.png" alt="botón atrás" srcset="">
    </a>
    

    <h1 id="titulo-resumen">Resumen de compra</h1>
    <div id="resumen">
        <div id="container" class="container">
            
        </div>
    </div>
    <div id="total">
        <span>Total a pagar:</span>
        <p id="total-resumen"></p>
    </div>

    <div id="btn-pagar-total" class="btn-pagar-cancelar">
      <button class="btn-pagar"  onclick="pagar()">PAGAR</button>
    </div>

    <div id="btn-cancelar" class="btn-pagar-cancelar">
      <button class="btn-pagar" onclick="carritoSalir()">CANCELAR</button>
    </div>

    <!-- modal -->
    <div id="exampleModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Mi carrito</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!-- <p>Modal body text goes here.</p> -->
            </div>
            <div class="modal-footer">
              <button type="button" id="vaciarCarrito" class="btn btn-danger">Vaciar carrito</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir comprando</button>
              <a href="resumen.html"><button type="button" class="btn btn-primary">Pagar</button></a>
              <span>Precio total:</span>
              <p id="precioTotal" class="text-center"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- modal pago tbk -->
      <div class="modal fade" id="modalTbk" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">Información pago</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div id="modal-body-tbk" class="modal-body">
              ...
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <!-- <button type="button" class="btn btn-primary">Save changes</button> -->
            </div>
          </div>
        </div>
      </div>

    <script src="js/resumen.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  </body>
</html>
